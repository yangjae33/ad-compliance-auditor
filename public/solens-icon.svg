<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer eye shape -->
  <path 
    d="M50 20C25 20 5 50 5 50s20 30 45 30 45-30 45-30-20-30-45-30z" 
    fill="url(#eyeGradient)"
    stroke="url(#strokeGradient)"
    stroke-width="3"
  />
  
  <!-- Iris -->
  <circle cx="50" cy="50" r="20" fill="url(#irisGradient)"/>
  
  <!-- Pupil -->
  <circle cx="50" cy="50" r="10" fill="#1a1a2e"/>
  
  <!-- Light reflection -->
  <circle cx="44" cy="44" r="4" fill="white" opacity="0.9"/>
  <circle cx="54" cy="46" r="2" fill="white" opacity="0.6"/>
  
  <!-- Lens effect ring -->
  <circle 
    cx="50" 
    cy="50" 
    r="16" 
    fill="none" 
    stroke="url(#lensGradient)" 
    stroke-width="2"
    opacity="0.7"
  />
  
  <defs>
    <!-- Eye white gradient -->
    <linearGradient id="eyeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    
    <!-- Stroke gradient (Shinhan blue) -->
    <linearGradient id="strokeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0046ff"/>
      <stop offset="50%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#0046ff"/>
    </linearGradient>
    
    <!-- Iris gradient (Shinhan blue tones) -->
    <radialGradient id="irisGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#0046ff"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    
    <!-- Lens ring gradient -->
    <linearGradient id="lensGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
</svg>
